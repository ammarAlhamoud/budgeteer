name: Verify Budgeteer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        timezone: [UTC, Europe/Berlin, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
